<!DOCTYPE html>
<html lang='en'>

<head>
	<meta charset='UTF-8'>
	<meta http-equiv='X-UA-Compatible' content='IE=edge'>
	<meta name='viewport' content='width=device-width, initial-scale=1.0'>
	<title>Timer</title>

	<link rel='stylesheet'
		href='https://cdn.jsdelivr.net/npm/modern-normalize@1.1.0/modern-normalize.min.css'>
  <script type="module" crossorigin src="/js-3.0/commonHelpers.js"></script>
  <link rel="modulepreload" crossorigin href="/js-3.0/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/js-3.0/assets/vendor-DRBXA5vM.js">
  <link rel="stylesheet" crossorigin href="/js-3.0/assets/vendor-CK8CL8qG.css">
  <link rel="stylesheet" crossorigin href="/js-3.0/assets/styles-C9_1GHgZ.css">
</head>

<body>
	<div class="buttons-position"><a class="navigation-button"
			href="./index.html">Home</a></div>


	<div class="time-counter">
		<div class="input-wrapper">
			<input type="text" id="datetime-picker" />
			<button type="button" data-start>Start</button>
		</div>
		<div class="timer">
			<div class="field">
				<span class="value" data-days>00</span>
				<span class="label">Days</span>
			</div>
			<div class="field">
				<span class="value" data-hours>00</span>
				<span class="label">Hours</span>
			</div>
			<div class="field">
				<span class="value" data-minutes>00</span>
				<span class="label">Minutes</span>
			</div>
			<div class="field">
				<span class="value" data-seconds>00</span>
				<span class="label">Seconds</span>
			</div>
		</div>
	</div>


</body>

</html>
